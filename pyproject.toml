[project]
name = "dailyread"
version = "0.1.0"
description = "Local daily reading digest: feeds -> Claude summaries/verdicts -> HTML"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = ["pytest>=8"]
# Browser UI tests (tests/test_ui.py) drive your installed Google Chrome. Optional: they skip when missing.
ui = ["playwright>=1.49"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
